name: Invoice Automation

on:
  # Manual trigger only - re-enable schedule when invoice automation is ready
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  process-invoices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run invoice automation
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          KEEP_CLIENT_ID: ${{ secrets.KEEP_CLIENT_ID }}
          KEEP_CLIENT_SECRET: ${{ secrets.KEEP_CLIENT_SECRET }}
          KEEP_API_BASE_URL: ${{ secrets.KEEP_API_BASE_URL }}
        run: python src/main.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: error-logs
          path: |
            *.log
          retention-days: 7
