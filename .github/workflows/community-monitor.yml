name: Community Monitor

on:
  schedule:
    # Every 2h, 04:00-20:00 UTC = 07:00-23:00 Israel (summer). Nine runs.
    # Must stay identical to the healthchecks.io cron or that alarms falsely.
    - cron: '0 4,6,8,10,12,14,16,18,20 * * *'
  workflow_dispatch:

# Telegram replies are drained from a shared queue; two runs at once would
# double-process them. Queue rather than overlap.
concurrency:
  group: community-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run community monitor
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          MONITORING_GROUPS: ${{ secrets.MONITORING_GROUPS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          TRAINING_MODE: ${{ secrets.TRAINING_MODE }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          DASHBOARD_URL: https://just-bake.streamlit.app/Community
        run: python -m src.community_monitor

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ Community monitor נכשל. ריצה ${{ github.run_id }}"
          if [ -n "${{ secrets.HEALTHCHECK_URL }}" ]; then
            curl -s -m 10 "${{ secrets.HEALTHCHECK_URL }}/fail" || true
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: community-monitor-logs
          path: "*.log"
          retention-days: 7
