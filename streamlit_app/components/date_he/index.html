<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <title>date_he</title>
  <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@2/dist/streamlit-component-lib.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: rgb(49, 51, 63);
    }
    input[type="date"] {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid rgba(49, 51, 63, 0.2);
      border-radius: 8px;
      background: white;
      box-sizing: border-box;
      color: rgb(49, 51, 63);
    }
    input[type="date"]:focus {
      outline: none;
      border-color: rgb(255, 75, 75);
      box-shadow: 0 0 0 1px rgb(255, 75, 75);
    }
  </style>
</head>
<body>
  <input id="dt" type="date" lang="he-IL" />
  <script>
    (function() {
      const input = document.getElementById('dt');

      Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, function(event) {
        const args = (event.detail && event.detail.args) || {};
        const v = args.value;
        // Only update if user isn't currently editing this field
        if (v && input.value !== v && document.activeElement !== input) {
          input.value = v;
        }
        Streamlit.setFrameHeight(input.offsetHeight + 6);
      });

      input.addEventListener('change', function() {
        Streamlit.setComponentValue(input.value);
      });

      Streamlit.setComponentReady();
      Streamlit.setFrameHeight(42);
    })();
  </script>
</body>
</html>
