<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <title>date_he</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      color: rgb(49, 51, 63);
    }
    .wrap { padding: 0; }
    input[type="date"] {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid rgba(49, 51, 63, 0.2);
      border-radius: 8px;
      background: white;
      box-sizing: border-box;
      color: rgb(49, 51, 63);
      font-family: inherit;
    }
    input[type="date"]:focus {
      outline: none;
      border-color: rgb(255, 75, 75);
      box-shadow: 0 0 0 1px rgb(255, 75, 75);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <input id="dt" type="date" lang="he-IL" />
  </div>
  <script>
    // Vanilla Streamlit component bridge via window.parent.postMessage.
    // No external library dependency — implements the iframe protocol directly.
    (function () {
      const input = document.getElementById('dt');

      function send(type, payload) {
        const msg = Object.assign(
          { isStreamlitMessage: true, type: type },
          payload || {}
        );
        window.parent.postMessage(msg, '*');
      }

      function pushHeight() {
        const h = (input.offsetHeight || 38) + 8;
        send('streamlit:setFrameHeight', { height: h });
      }

      window.addEventListener('message', function (event) {
        const data = event.data || {};
        if (data.type !== 'streamlit:render') return;
        const args = data.args || {};
        const v = args.value;
        // Only overwrite when not actively being edited
        if (v && input.value !== v && document.activeElement !== input) {
          input.value = v;
        }
        pushHeight();
      });

      input.addEventListener('change', function () {
        send('streamlit:setComponentValue', {
          value: input.value,
          dataType: 'json'
        });
      });

      // Notify Streamlit we're ready and report initial height
      send('streamlit:componentReady', { apiVersion: 1 });
      pushHeight();
      // Re-push height after fonts/layout settle
      setTimeout(pushHeight, 50);
      setTimeout(pushHeight, 250);
    })();
  </script>
</body>
</html>
